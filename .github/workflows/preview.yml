# Per-PR preview deployments.
#
# This workflow is OPT-IN. The boilerplate ships with placeholder wrangler
# IDs and no Cloudflare credentials, so previews stay off until you wire up
# your own account:
#
#   1. Set the repo VARIABLE `CLOUDFLARE_ACCOUNT_ID`
#      (Settings → Secrets and variables → Actions → Variables tab) to your
#      Cloudflare account ID.
#   2. Set the repo SECRET `CLOUDFLARE_API_TOKEN`
#      (same page → Secrets tab) to an API token created from the
#      "Edit Cloudflare Workers" template, with "D1:Edit" permission added
#      (the template alone can't run D1 migrations).
#
# Once both are set, every PR gets its own Worker version at a stable URL
# posted as a PR comment, backed by its own D1 database (provisioned here,
# deleted on close by preview-cleanup.yml). `bun run setup` provisions the
# rest of the `preview` environment (R2 + Worker) — see wrangler.jsonc's
# `env.preview` block.
name: Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy-preview:
    name: Deploy preview
    runs-on: ubuntu-latest
    if: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' }}
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The job gate can only see the CLOUDFLARE_ACCOUNT_ID variable (secrets
      # aren't readable in job-level `if`), so verify the token separately.
      - name: Check Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is set but the CLOUDFLARE_API_TOKEN secret is missing or empty. Set it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Provision per-PR D1
        run: bun scripts/ci/setup-preview-db.ts ${{ github.event.number }}

      - name: Migrate per-PR D1
        run: bunx wrangler d1 migrations apply DATABASE --env preview --remote

      - name: Seed per-PR D1
        run: bun scripts/seed-preview.ts --preview

      - name: Build (preview env)
        env:
          CLOUDFLARE_ENV: preview
        run: bun run build

      # NOTE: a Worker's FIRST-EVER Durable Object migration cannot be applied
      # via `wrangler versions upload` (it errors with code 10211 —
      # "migrations must be fully applied via a non-versioned deployment").
      # The `home-karaoke-preview` base Worker must therefore be bootstrapped
      # once with a full `wrangler deploy --env preview` before per-PR version
      # uploads succeed. `bun run setup` handles this; if you add a NEW DO
      # class later, re-run that full deploy once.
      - name: Upload preview version
        id: upload
        run: |
          # Capture wrangler's own output without `set -e` aborting on the
          # command-substitution assignment — otherwise a real wrangler
          # failure (e.g. the DO-migration error above) is swallowed before we
          # ever echo it, leaving a bare "exit code 1" with no context.
          set +e
          OUT=$(bunx wrangler versions upload --preview-alias "pr-${{ github.event.number }}" 2>&1)
          STATUS=$?
          set -e
          echo "$OUT"
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::wrangler versions upload failed (exit $STATUS). See the log above for the underlying Cloudflare error."
            exit 1
          fi
          ALIAS_URL=$(printf '%s' "$OUT" | grep -oE 'Version Preview Alias URL: https://\S+' | awk '{print $NF}')
          VERSION_URL=$(printf '%s' "$OUT" | grep -oE 'Version Preview URL: https://\S+' | awk '{print $NF}')
          {
            echo "alias_url=$ALIAS_URL"
            echo "version_url=$VERSION_URL"
          } >> "$GITHUB_OUTPUT"
          # The version uploaded fine even if no preview URL was emitted, so
          # warn (don't fail the check). wrangler only prints preview URLs when
          # the uploaded version reports `has_preview` — which requires Preview
          # URLs to be enabled for the Worker (Cloudflare dashboard → the
          # Worker → Settings → Preview URLs, and `preview_urls: true` in
          # wrangler.jsonc). The PR comment falls back to the version ID.
          if [ -z "$ALIAS_URL" ] || [ -z "$VERSION_URL" ]; then
            echo "::warning::wrangler uploaded the version but emitted no preview URL. Preview URLs may be disabled for the home-karaoke-preview Worker — the PR comment will omit the live link. See https://developers.cloudflare.com/workers/configuration/previews/"
          fi

      # The seed summary comes from the seed script itself (--describe), so
      # extending fixtures in scripts/seed-preview.ts automatically updates
      # every future PR comment — no workflow edit needed.
      - name: Compose PR comment
        env:
          ALIAS_URL: ${{ steps.upload.outputs.alias_url }}
          VERSION_URL: ${{ steps.upload.outputs.version_url }}
        run: |
          {
            echo "### Preview deployment"
            echo
            if [ -n "$ALIAS_URL" ]; then
              echo "**$ALIAS_URL**"
              echo
              echo "Per-commit version: $VERSION_URL"
            else
              echo "_Preview URLs are disabled for this Worker, so there's no"
              echo "live link. The version uploaded successfully — enable Preview"
              echo "URLs in the Cloudflare dashboard (the Worker → Settings) to"
              echo "get a shareable URL here._"
            fi
            echo "Commit: \`${{ github.sha }}\`"
            echo
            echo "Data: this PR gets its **own D1 database** (created when the PR"
            echo "opens, deleted when it closes). The preview R2 bucket is shared"
            echo "across all PR previews."
            echo
            bun scripts/seed-preview.ts --describe
            echo
            echo "No manual teardown needed — uploaded versions age out on their"
            echo "own, and the per-PR database is deleted on close by"
            echo "\`preview-cleanup.yml\`."
          } > "$RUNNER_TEMP/preview-comment.md"

      - name: Comment preview URL on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview
          path: ${{ runner.temp }}/preview-comment.md
